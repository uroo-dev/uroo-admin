name: Build & Release UROO.Admin

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: mobile

jobs:
  build:
    name: Build APK & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android NDK
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ ! -d "$NDK_DIR" ]; then
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -f "$SDKM" ]; then
              SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
            fi
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "ndk;28.2.13676358"
          else
            echo "NDK 28.2.13676358 already installed."
          fi

      - name: Pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Setup release signing (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/uroo-admin-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s/android/keystore/uroo-admin-release.jks\n' \
              "$KEYSTORE_STORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" \
              "$KEYSTORE_KEY_ALIAS" "$(pwd)" > android/key.properties
            echo "Release signing configured."
          else
            echo "No keystore secret set - using debug signing fallback."
          fi

      - name: Analyze & Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          flutter test

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cp build/app/outputs/flutter-apk/app-release.apk UROO.Admin.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UROO.Admin.apk
          path: ${{ env.PROJECT_DIR }}/UROO.Admin.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: UROO.Admin ${{ github.ref_name }}
          files: ${{ env.PROJECT_DIR }}/UROO.Admin.apk
          generate_release_notes: true

      - name: Build Web (for Pages download page)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --base-href "$BASE_PATH"
          cp build/app/outputs/flutter-apk/app-release.apk build/web/UROO.Admin.apk

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (web + APK)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
