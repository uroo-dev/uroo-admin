name: uro_admin
description: "UROO.Admin - Business management app (Neo Brutalism) backed by Supabase"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Supabase credentials are injected at build time via:
#   --dart-define=SUPABASE_URL=... --dart-define=SUPABASE_ANON_KEY=...